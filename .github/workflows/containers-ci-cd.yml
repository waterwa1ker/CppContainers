name: Containers-ci-cd

on:
  push:
    branches:
      - 'develop**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup complier
        uses: rlalik/setup-cpp-compiler@master
        with:
            compiler: latest
      - name: Build static library
        run: |
          cd src
          make containers.a

  style:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Style check
        uses: jidicula/clang-format-action@v4.11.0
        with:
          clang-format-version: '11'
          check-path: 'src'
          fallback-style: 'Google'

  test:
    needs: [style]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup complier
        uses: rlalik/setup-cpp-compiler@master
      - name: Gtest
        uses: ArhNex/dock_s21_for_testing@main
        with:
            compiler: latest
      - name: testing static lib
        run: |
          cd src
          make test


